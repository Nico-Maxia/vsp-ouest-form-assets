<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ouverture WhatsApp…</title>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var id = (params.get("id") || params.get("c") || "").trim();
      var text =
        "CODE SUIVI - " +
        id +
        "\n\nBonjour, voici ma vidéo / photo.";
      var url =
        "https://wa.me/33683959703?text=" + encodeURIComponent(text);
      window.location.replace(url);
    })();
  </script>
</head>
<body style="font-family: sans-serif; padding: 2rem; color: #07274a;">
  <p>Ouverture de WhatsApp…</p>
  <p>Si rien ne se passe, <a id="fallback" href="#">clique ici</a>.</p>
  <script>
    document.getElementById("fallback").href =
      "https://wa.me/33683959703?text=" +
      encodeURIComponent(
        "CODE SUIVI - " +
          (new URLSearchParams(location.search).get("id") || "") +
          "\n\nBonjour, voici ma vidéo / photo."
      );
  </script>
</body>
</html>
